name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # GitHub-hosted Ubuntu includes Google Chrome; the plugin never downloads a browser.
      - run: google-chrome --version
      - run: npm run test:browser
      - run: git diff --exit-code -- dist
      - run: npm pack --ignore-scripts --dry-run
  native-pip:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      # Maintainers compile both architectures; users install the bundled executable.
      - run: npm run build:native
      - run: codesign --verify --strict native/bin/dsh-native-pip
      - run: npm run test:native-pip
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
